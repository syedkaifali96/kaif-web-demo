<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-labelledby="title"><title id="title">MaalBot — project interface concept</title><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#202736" flood-opacity=".12"/></filter><linearGradient id="wash" x2="1" y2="1"><stop stop-color="#d8cbed"/><stop offset="1" stop-color="#f2f2f0"/></linearGradient></defs><rect width="1200" height="750" fill="url(#wash)"/><g font-family="Arial,Helvetica,sans-serif"><g filter="url(#shadow)"><rect x="95" y="100" width="1010" height="560" rx="18" fill="#ffffff" stroke="none"/><rect x="95" y="100" width="1010" height="46" rx="18" fill="#f8f9fc" stroke="none"/><circle cx="120" cy="123" r="5" fill="#efb1af"/><circle cx="138" cy="123" r="5" fill="#efd18e"/><circle cx="156" cy="123" r="5" fill="#b7d7b1"/><rect x="390" y="112" width="420" height="24" rx="6" fill="#eef0f5" stroke="none"/><text x="530" y="129" font-size="10" fill="#72798b" font-weight="600">PROJECT / INTERFACE CONCEPT</text><rect x="95" y="146" width="205" height="514" rx="0" fill="#f7f8fb" stroke="none"/><text x="123" y="191" font-size="23" fill="#252830" font-weight="750">MaalBot</text><text x="123" y="217" font-size="12" fill="#8790a0" font-weight="500">LEARN. PLAN. KEEP ASKING.</text><rect x="112" y="250" width="172" height="39" rx="8" fill="#d8cbed" stroke="none"/><text x="131" y="275" font-size="14" fill="#303541" font-weight="600">Overview</text><text x="131" y="327" font-size="14" fill="#727b8b" font-weight="500">Explore</text><text x="131" y="379" font-size="14" fill="#727b8b" font-weight="500">My workspace</text><text x="131" y="431" font-size="14" fill="#727b8b" font-weight="500">Settings</text><text x="123" y="614" font-size="10" fill="#8790a0" font-weight="650">KAIF / PROJECT STUDY</text><text x="330" y="193" font-size="28" fill="#252830" font-weight="750">Let’s talk about money</text><text x="330" y="221" font-size="14" fill="#788295" font-weight="500">Financial learning in Roman Urdu and English.</text><rect x="330" y="250" width="450" height="366" rx="14" fill="#f7f8fc" stroke="none"/><rect x="351" y="273" width="380" height="65" rx="12" fill="#ffffff" stroke="none"/><text x="372" y="301" font-size="16" fill="#252830" font-weight="650">How can I start saving?</text><text x="372" y="321" font-size="12" fill="#7d8798" font-weight="500">A little each month, with a clear goal.</text><rect x="380" y="359" width="378" height="66" rx="12" fill="#d8cbed" stroke="none"/><text x="401" y="388" font-size="14" fill="#252830" font-weight="650">Mujhe ek savings goal banana hai.</text><text x="401" y="409" font-size="12" fill="#70788c" font-weight="500">Let’s work through it together.</text><rect x="352" y="463" width="372" height="7" rx="3" fill="#d9dde6" stroke="none"/><rect x="352" y="483" width="329" height="7" rx="3" fill="#d9dde6" stroke="none"/><rect x="352" y="503" width="348" height="7" rx="3" fill="#d9dde6" stroke="none"/><rect x="352" y="523" width="249" height="7" rx="3" fill="#d9dde6" stroke="none"/><rect x="351" y="556" width="407" height="40" rx="20" fill="#ffffff" stroke="#e2e6ee"/><text x="371" y="582" font-size="12" fill="#9099a8" font-weight="500">Ask your next question…</text><rect x="805" y="250" width="263" height="366" rx="14" fill="#fafbfc" stroke="none"/><text x="827" y="287" font-size="19" fill="#252830" font-weight="700">Savings planner</text><text x="827" y="326" font-size="11" fill="#8b93a1" font-weight="650">YOUR GOAL</text><text x="827" y="364" font-size="28" fill="#252830" font-weight="750">Rs. 25,000</text><rect x="827" y="388" width="218" height="9" rx="4" fill="#e4e7ef" stroke="none"/><rect x="827" y="388" width="103" height="9" rx="4" fill="#d8cbed" stroke="none"/><text x="827" y="435" font-size="13" fill="#7a8495" font-weight="500">Monthly contribution</text><text x="827" y="466" font-size="22" fill="#252830" font-weight="650">Rs. 2,500</text><rect x="827" y="551" width="172" height="32" rx="16" fill="#d8cbed" stroke="none"/><text x="841" y="573" font-size="13" fill="#4f5670" font-weight="600">LEARNING PROTOTYPE</text></g><text x="97" y="60" font-size="23" fill="#252830" font-weight="750">MaalBot</text><text x="955" y="60" font-size="12" fill="#627080" font-weight="600">PROJECT STUDY</text><text x="95" y="706" font-size="11" fill="#627080" font-weight="600">INTERFACE CONCEPT / PERSONAL &amp; EDUCATIONAL PROJECT</text></g></svg>